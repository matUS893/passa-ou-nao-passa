<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Passa ou Não Passa?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #111827;
}

header {
    background: #2563eb;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 8px 0 0;
}

.container {
    max-width: 550px;
    margin: 25px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.materia {
    border: 2px solid #e5e7eb;
}

.titulo-materia {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background: #2563eb;
}

button:active {
    transform: scale(0.98);
}

.adicionar {
    background: #16a34a;
}

.calcular {
    background: #2563eb;
    font-size: 18px;
}

.remover {
    background: #dc2626;
    font-size: 14px;
}

.resultado {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    display: none;
}

.verde {
    background: #dcfce7;
    color: #166534;
}

.azul {
    background: #dbeafe;
    color: #1e40af;
}

.vermelho {
    background: #fee2e2;
    color: #991b1b;
}

.numero {
    font-size: 32px;
    margin: 8px;
}

#resultadoGeral {
    display: none;
}

footer {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    padding: 20px;
}

</style>

</head>

<body>


<header>

<h1>📚 Passa ou Não Passa?</h1>

<p>
Descubra quanto precisa tirar para passar.
</p>

</header>


<div class="container">


<div id="materias">


<div class="card materia">

<div class="titulo-materia">
📖 Matéria 1
</div>

<label>Nome da matéria</label>

<input
type="text"
class="nome"
placeholder="Ex: Matemática">


<label>Notas que você já tirou</label>

<input
type="text"
class="notas"
placeholder="Ex: 5, 6, 4">


<label>Média mínima</label>

<input
type="number"
class="media"
value="6"
min="0"
max="10"
step="0.1">

<div class="resultado"></div>

</div>


</div>


<button
class="adicionar"
onclick="adicionarMateria()">

➕ ADICIONAR MATÉRIA

</button>


<button
class="calcular"
onclick="calcularTudo()">

🧮 CALCULAR TUDO

</button>


<div
id="resultadoGeral"
class="card">

<h2>📊 Seu boletim</h2>

<div id="resumo"></div>

</div>


</div>


<footer>

Passa ou Não Passa? — Calculadora escolar

</footer>


<script>

let contador = 1;


function adicionarMateria() {

    contador++;

    let div = document.createElement("div");

    div.className = "card materia";

    div.innerHTML = `

        <div class="titulo-materia">
            📖 Matéria ${contador}
        </div>

        <label>Nome da matéria</label>

        <input
            type="text"
            class="nome"
            placeholder="Ex: Português">

        <label>
            Notas que você já tirou
        </label>

        <input
            type="text"
            class="notas"
            placeholder="Ex: 7, 5.5, 8">

        <label>
            Média mínima
        </label>

        <input
            type="number"
            class="media"
            value="6"
            min="0"
            max="10"
            step="0.1">

        <div class="resultado"></div>

        <button
            class="remover"
            onclick="removerMateria(this)">

            🗑️ REMOVER MATÉRIA

        </button>

    `;

    document
    .getElementById("materias")
    .appendChild(div);
}


function removerMateria(botao) {

    botao
    .parentElement
    .remove();

}


function calcularTudo() {

    let materias =
    document.querySelectorAll(".materia");

    let resumo = "";

    let quantidade = 0;


    materias.forEach(function(materia) {

        let nome =
        materia
        .querySelector(".nome")
        .value
        .trim();

        let textoNotas =
        materia
        .querySelector(".notas")
        .value
        .trim();

        let media =
        Number(
            materia
            .querySelector(".media")
            .value
        );

        let resultado =
        materia
        .querySelector(".resultado");


        if (textoNotas === "") {

            resultado.className =
            "resultado vermelho";

            resultado.innerHTML =
            "Digite pelo menos uma nota.";

            resultado.style.display =
            "block";

            return;
        }


        let partes =
        textoNotas.split(",");


        let notas = [];


        for (let parte of partes) {

            let nota =
            Number(
                parte.trim()
            );


            if (
                isNaN(nota) ||
                nota < 0 ||
                nota > 10
            ) {

                resultado.className =
                "resultado vermelho";

                resultado.innerHTML =
                "Confira as notas digitadas.";

                resultado.style.display =
                "block";

                return;
            }


            notas.push(nota);

        }


        let soma = 0;


        notas.forEach(function(nota) {

            soma += nota;

        });


        let mediaAtual =
        soma / notas.length;


        let notaNecessaria =
        (media * (notas.length + 1))
        - soma;


        notaNecessaria =
        Math.round(
            notaNecessaria * 10
        ) / 10;


        let nomeExibicao =
        nome || "Matéria";


        if (notaNecessaria <= 0) {

            resultado.className =
            "resultado verde";

            resultado.innerHTML =
            "✅ Já está acima da média!";

            resultado.style.display =
            "block";


            resumo += `
                <p>
                🟢 <strong>
                ${nomeExibicao}
                </strong>:
                já está acima da média.
                </p>
            `;

        }

        else if (notaNecessaria > 10) {

            resultado.className =
            "resultado vermelho";

            resultado.innerHTML =
            "❌ Precisaria tirar " +
            notaNecessaria +
            ".";

            resultado.style.display =
            "block";


            resumo += `
                <p>
                🔴 <strong>
                ${nomeExibicao}
                </strong>:
                precisaria tirar
                ${notaNecessaria}.
                </p>
            `;

        }

        else {

            resultado.className =
            "resultado azul";

            resultado.innerHTML =

            "Você precisa tirar:" +

            "<div class='numero'>" +
            notaNecessaria +
            "</div>" +

            "na próxima prova.";

            resultado.style.display =
            "block";


            resumo += `
                <p>
                🔵 <strong>
                ${nomeExibicao}
                </strong>:
                precisa tirar
                <strong>
                ${notaNecessaria}
                </strong>.
                </p>
            `;

        }


        quantidade++;

    });


    if (quantidade > 0) {

        document
        .getElementById("resumo")
        .innerHTML = resumo;

        document
        .getElementById("resultadoGeral")
        .style.display = "block";

    }

}

</script>

</body>

</html>
