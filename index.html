<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passa ou Não Passa?</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #111827;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            opacity: 0.9;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .limpar {
            background: #6b7280;
        }

        #resultado {
            display: none;
            margin-top: 22px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }

        #resultado h2 {
            margin-top: 0;
        }

        .sucesso {
            background: #dcfce7;
            color: #166534;
        }

        .normal {
            background: #dbeafe;
            color: #1e40af;
        }

        .erro {
            background: #fee2e2;
            color: #991b1b;
        }

        .nota-grande {
            font-size: 36px;
            margin: 10px 0;
            font-weight: bold;
        }

        .rodape {
            text-align: center;
            color: #6b7280;
            font-size: 13px;
            margin: 25px 0;
        }

    </style>
</head>

<body>

<header>

    <h1>📚 Passa ou Não Passa?</h1>

    <p>
        Descubra quanto precisa tirar na próxima prova.
    </p>

</header>


<div class="container">

    <div class="card">

        <label>📖 Matéria</label>

        <input
            type="text"
            id="materia"
            placeholder="Ex: Matemática"
        >


        <label>📝 Nota 1</label>

        <input
            type="number"
            id="nota1"
            min="0"
            max="10"
            step="0.1"
            placeholder="Ex: 5"
        >


        <label>📝 Nota 2</label>

        <input
            type="number"
            id="nota2"
            min="0"
            max="10"
            step="0.1"
            placeholder="Ex: 6"
        >


        <label>📝 Nota 3</label>

        <input
            type="number"
            id="nota3"
            min="0"
            max="10"
            step="0.1"
            placeholder="Ex: 4"
        >


        <label>📝 Nota 4 (opcional)</label>

        <input
            type="number"
            id="nota4"
            min="0"
            max="10"
            step="0.1"
            placeholder="Opcional"
        >


        <label>🎯 Média mínima para passar</label>

        <input
            type="number"
            id="mediaMinima"
            min="0"
            max="10"
            step="0.1"
            value="6"
        >


        <button onclick="calcular()">
            🧮 CALCULAR
        </button>


        <button
            class="limpar"
            onclick="limpar()"
        >
            🔄 NOVO CÁLCULO
        </button>


        <div id="resultado"></div>

    </div>


    <div class="rodape">

        Passa ou Não Passa? — Calculadora escolar

    </div>

</div>


<script>

function calcular() {

    let materia =
        document.getElementById("materia").value.trim();


    let notas = [];

    let campos = [
        "nota1",
        "nota2",
        "nota3",
        "nota4"
    ];


    for (let id of campos) {

        let valor =
            document.getElementById(id).value;

        if (valor !== "") {

            let nota = Number(valor);

            if (nota < 0 || nota > 10) {

                mostrarErro(
                    "As notas precisam estar entre 0 e 10."
                );

                return;
            }

            notas.push(nota);
        }
    }


    let mediaMinima =
        Number(
            document.getElementById("mediaMinima").value
        );


    if (notas.length === 0) {

        mostrarErro(
            "Digite pelo menos uma nota."
        );

        return;
    }


    if (
        mediaMinima < 0 ||
        mediaMinima > 10
    ) {

        mostrarErro(
            "A média mínima precisa estar entre 0 e 10."
        );

        return;
    }


    let soma = 0;


    for (let nota of notas) {

        soma += nota;

    }


    let notaNecessaria =
        (mediaMinima * (notas.length + 1))
        - soma;


    notaNecessaria =
        Math.round(notaNecessaria * 10) / 10;


    let nomeMateria =
        materia || "essa matéria";


    if (notaNecessaria <= 0) {

        mostrarResultado(
            "sucesso",
            "🎉 Você já passou!",
            "Você já está acima da média em " +
            nomeMateria + "."
        );

        return;
    }


    if (notaNecessaria > 10) {

        mostrarResultado(
            "erro",
            "😬 Ficou difícil!",
            "Você precisaria tirar " +
            notaNecessaria +
            " na próxima prova. Essa nota é maior que 10."
        );

        return;
    }


    mostrarResultado(
        "normal",
        "📚 Você precisa tirar:",
        "<div class='nota-grande'>" +
        notaNecessaria +
        "</div>" +
        "na próxima prova de " +
        nomeMateria +
        " para alcançar média " +
        mediaMinima +
        "."
    );

}


function mostrarResultado(
    classe,
    titulo,
    texto
) {

    let resultado =
        document.getElementById("resultado");


    resultado.className = classe;


    resultado.innerHTML =
        "<h2>" +
        titulo +
        "</h2>" +
        "<p>" +
        texto +
        "</p>";


    resultado.style.display = "block";

}


function mostrarErro(texto) {

    mostrarResultado(
        "erro",
        "⚠️ Atenção",
        texto
    );

}


function limpar() {

    document.getElementById("materia").value = "";

    document.getElementById("nota1").value = "";

    document.getElementById("nota2").value = "";

    document.getElementById("nota3").value = "";

    document.getElementById("nota4").value = "";

    document.getElementById("mediaMinima").value = "6";


    document.getElementById("resultado").style.display =
        "none";

}

</script>

</body>
</html>
